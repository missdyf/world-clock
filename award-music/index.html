<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>充滿榮耀的頒獎音樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff4ea; --card:#ffe6d2; --ink:#2e1e3a; --pink:#ff69b4; --pink-dark:#d6408f; --muted:#8a6a7a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    background:var(--bg); color:var(--ink);
    font-family:"DotGothic16", system-ui, sans-serif;
    background-image:radial-gradient(#ffd7e8 1.5px, transparent 1.5px); background-size:18px 18px;
  }
  main{flex:1; width:100%; max-width:520px; padding:32px 16px; display:flex; flex-direction:column; align-items:center; gap:24px}
  h1{font-family:"DotGothic16", "Press Start 2P", monospace; font-size:26px; line-height:1.6; text-align:center; margin:0; color:var(--pink-dark)}
  .stage{
    width:100%; max-width:384px; aspect-ratio:1; border:6px solid var(--ink);
    box-shadow:8px 8px 0 var(--pink); background:var(--card); image-rendering:pixelated;
  }
  .stage img{width:100%; height:100%; display:block; image-rendering:pixelated}
  #play{
    font-family:"Press Start 2P", monospace; font-size:20px; letter-spacing:1px;
    padding:20px 36px; color:#fff; background:var(--pink); border:4px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink); cursor:pointer; display:flex; align-items:center; gap:14px;
    transition:transform .05s, box-shadow .05s;
  }
  #play:hover:not(:disabled){background:var(--pink-dark)}
  #play:active:not(:disabled){transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink)}
  #play:disabled{opacity:.6; cursor:default}
  #play:focus-visible{outline:4px dashed var(--pink-dark); outline-offset:6px}
  .tri{width:0;height:0;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
  #status{min-height:1.4em; color:var(--muted); font-size:16px; text-align:center}
  .bar{width:100%; max-width:384px; height:14px; border:3px solid var(--ink); background:#fff}
  .bar > div{height:100%; width:0; background:var(--pink)}
  /* YouTube 播放器保持可見但縮小（YouTube 規範要求播放器可見） */
  .yt{width:200px; height:200px; opacity:.9; border:3px solid var(--ink)}
  .yt iframe, #yt{width:100%; height:100%}
  footer{width:100%; padding:16px; text-align:center; font-size:14px; color:var(--muted); border-top:3px dashed #f3c2d8}
  footer a{color:var(--pink-dark); word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>♪ 充滿榮耀的頒獎音樂 ♪</h1>

  <div class="stage">
    <img id="conductor" src="conductor-still.png" alt="戴粉紅眼鏡、法國貴族造型的 8bit 指揮家剪影">
  </div>

  <button id="play" disabled><span class="tri"></span><span id="label">載入中…</span></button>
  <div class="bar" aria-hidden="true"><div id="progress"></div></div>
  <div id="status"></div>

  <div class="yt"><iframe id="yt" title="YouTube 音樂播放器" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" frameborder="0"></iframe></div>
</main>

<footer>
  音樂出處：<a href="https://youtu.be/dMTDjavVmH4" target="_blank" rel="noopener">https://youtu.be/dMTDjavVmH4</a>（播放片段 0:24–0:45）
</footer>

<script>
  const VIDEO_ID = 'dMTDjavVmH4';
  const START = 24, END = 45, FADE = 5;   // 最後 5 秒漸弱
  const btn = document.getElementById('play');
  const label = document.getElementById('label');
  const status = document.getElementById('status');
  const img = document.getElementById('conductor');
  const prog = document.getElementById('progress');
  const GIF = 'conductor.gif', STILL = 'conductor-still.png';
  new Image().src = GIF; // 預先載入
  let player, timer = null, playing = false;

  const isFile = location.protocol === 'file:';
  function showError(msg){
    status.innerHTML = msg;
    label.textContent = '無法播放';
    btn.disabled = true;
    stopAnim();
  }

  // 自行建立 iframe，確保帶有 referrerpolicy（YouTube 錯誤 153 的修正）
  const params = new URLSearchParams({
    enablejsapi: 1, start: START, end: END, controls: 0, disablekb: 1,
    playsinline: 1, rel: 0
  });
  if (!isFile) params.set('origin', location.origin);
  document.getElementById('yt').src = 'https://www.youtube.com/embed/' + VIDEO_ID + '?' + params;

  if (isFile) {
    showError('⚠️ 目前是直接開啟檔案（file://），YouTube 會拒絕播放（錯誤 153）。<br>請將網頁放到網站上，或用本機伺服器開啟（見說明）。');
  }

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // 10 秒內播放器都沒有準備好，就顯示提示，避免一直卡在「載入中」
  const readyTimeout = setTimeout(() => {
    if (!player || btn.disabled) showError('播放器載入逾時，請確認網路連線，並以 http(s) 網址開啟本頁。');
  }, 10000);

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      events: {
        onReady: () => {
          clearTimeout(readyTimeout);
          if (isFile) return;
          btn.disabled = false; label.textContent = '播放';
        },
        onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED && playing) finish(); },
        onError: (e) => {
          clearTimeout(readyTimeout); clearInterval(timer); playing = false;
          showError('影片無法載入（錯誤 ' + e.data + '）。' + (e.data === 153 || e.data === 152
            ? '請以 http(s) 網址開啟本頁，不要直接開啟檔案。'
            : (e.data === 101 || e.data === 150 ? '此影片的擁有者不允許嵌入播放。' : '')));
        }
      }
    });
  };

  function startAnim(){ img.src = GIF + '?t=' + Date.now(); }
  function stopAnim(){ img.src = STILL; }

  btn.addEventListener('click', () => {
    if (!player || playing) return;
    playing = true;
    btn.disabled = true; label.textContent = '演奏中';
    status.textContent = '';
    player.setVolume(100);
    player.unMute();
    player.seekTo(START, true);
    player.playVideo();
    startAnim();
    clearInterval(timer);
    timer = setInterval(tick, 50);
  });

  function tick(){
    const t = player.getCurrentTime();
    if (t < START - 1) return;
    prog.style.width = Math.min(100, Math.max(0, (t - START) / (END - START) * 100)) + '%';
    if (t >= END - FADE) {
      const v = Math.max(0, Math.round(100 * (END - t) / FADE));
      player.setVolume(v);
    }
    if (t >= END - 0.05) finish();
  }

  function finish(){
    clearInterval(timer); timer = null;
    playing = false;
    player.pauseVideo();
    player.setVolume(100);
    prog.style.width = '100%';
    stopAnim();
    btn.disabled = false; label.textContent = '再聽一次';
    status.textContent = 'Bravo! 👏';
  }
</script>
</body>
</html>
