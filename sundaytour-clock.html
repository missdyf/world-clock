<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>晴天旅遊世界時鐘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: quiet header with a single round "+" at top-right; a wrapping grid of clock cards, each holding a row of split-flap tiles. */
:root {
  --bg: #e7e9ec;
  --surface: #f5f6f7;
  --ink: #1c1f24;
  --muted: #6b717b;
  --line: #d3d7dc;
  --tile: #1d2024;
  --tile-hi: #26292e;
  --tile-ink: #f1f0ea;
  --hinge: #0d0e10;
  --accent: #c9762e;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px -18px rgba(20,25,35,.35);
  --font-digit: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif-condensed, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101113; --surface: #17191c; --ink: #e9e8e3; --muted: #8d939c; --line: #2a2d32;
    --tile: #24272c; --tile-hi: #2c3035; --tile-ink: #efeee8; --hinge: #0b0c0d; --accent: #e0914a;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101113; --surface: #17191c; --ink: #e9e8e3; --muted: #8d939c; --line: #2a2d32;
  --tile: #24272c; --tile-hi: #2c3035; --tile-ink: #efeee8; --hinge: #0b0c0d; --accent: #e0914a;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  min-height: 100%;
}
.wrap { max-width: 1240px; margin: 0 auto; }

header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-block: 28px 24px;
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: .12em; text-wrap: balance; }
.local { color: var(--muted); font-size: .82rem; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

.actions { display: flex; align-items: center; gap: 10px; flex: none; }
/* Two-option switch: the current language is the filled half. */
.lang-btn {
  display: inline-flex; align-items: center; gap: 2px;
  height: 48px; padding: 4px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-family: var(--font-digit); font-size: 1.05rem; font-weight: 600; letter-spacing: .08em;
  cursor: pointer; box-shadow: var(--shadow); transition: border-color .2s ease;
}
.lang-btn:hover { border-color: var(--accent); }
.lang-btn span { display: grid; place-items: center; height: 38px; min-width: 40px; padding: 0 8px; border-radius: 999px; color: var(--muted); transition: background .2s ease, color .2s ease; }
.lang-btn span.on { background: var(--ink); color: var(--surface); }
.lang-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:root[lang="en"] .is-local .country::after { content: "LOCAL"; letter-spacing: .1em; }
.add-btn {
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .2s ease, border-color .2s ease;
}
.add-btn:hover { transform: rotate(90deg); border-color: var(--accent); }
.add-btn:focus-visible, button:focus-visible, input:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.add-btn svg { width: 20px; height: 20px; }

.grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
}

.card {
  position: relative; container-type: inline-size;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 18px 20px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
/* Each card follows its own city's daylight: light card while the sun is up, dark card after sunset. */
.card.is-day {
  --surface: #f8f7f3; --ink: #1c1f24; --muted: #69707a; --line: #e2dfd7; --chip: #eeece6; --moon: #c8b98c;
  --tile: #ffffff; --tile-hi: #f4f3ef; --tile-ink: #1d2024; --hinge: #d9d5cc;
  color-scheme: light;
}
.card.is-night {
  --surface: #15171b; --ink: #e9e8e3; --muted: #8f959e; --line: #2b2e34; --chip: #22252b; --moon: #ecebe3;
  --tile: #262a30; --tile-hi: #2e3239; --tile-ink: #efeee8; --hinge: #0b0c0d;
  color-scheme: dark;
}
/* Sunrise/sunset/moonrise/moonset: a blue-grey sky over the top ~70% fading to cream at the bottom ~30%. */
.card.is-twilight {
  --tw-dark: #B4C4D6; --tw-light: #F8F7F3;
  --tile: #262a30; --tile-hi: #2e3239; --tile-ink: #efeee8; --hinge: #0b0c0d;
  background: linear-gradient(180deg, var(--tw-dark) 0%, var(--tw-dark) 50%, var(--tw-light) 82%, var(--tw-light) 100%);
}
.card.is-twilight .card-head { --ink: #1c1f24; --muted: #3c424b; --chip: rgba(255,255,255,.35); color: var(--ink); }
.card.is-twilight .date { --ink: #1c1f24; --muted: #5f6670; --surface: var(--tw-light); --moon: #c8b98c; color: var(--ink); border-top-color: rgba(28,31,36,.14); }
.card.is-twilight .flip { box-shadow: 0 .04em .12em rgba(0,0,0,.3); }
.card.is-day .flip { box-shadow: 0 0 0 1px #e4e1d9, 0 .04em .1em rgba(30,25,15,.12); }
.card { color: var(--ink); transition: background-color .6s ease, border-color .6s ease; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-right: 68px; }
/* Names stay on one line (full name in the tooltip) so every card in a row lines up. */
.place { min-width: 0; flex: 1; }
.country { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: .06em; line-height: 1.3; }
.country .name, .city { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.city { color: var(--muted); font-size: .8rem; letter-spacing: .05em; }
.meta { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.offset { font-family: var(--font-digit); font-weight: 600; font-size: .95rem; letter-spacing: .08em; color: var(--ink); }
.rel { color: var(--muted); font-size: .74rem; letter-spacing: .04em; white-space: nowrap; }

.remove {
  position: absolute; top: 12px; right: 10px;
  width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent;
  color: var(--muted); cursor: pointer; display: grid; place-items: center;
  opacity: .55; transition: opacity .15s, background .15s, color .15s;
}
.remove svg { width: 14px; height: 14px; }
/* Local card: solid accent frame plus a soft halo, so it reads as "here" in both day and night colours. */
.card.is-local {
  border: 2px solid var(--accent);
  padding: 17px 17px 19px;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow);
}
.card.is-local .remove, .card.is-local .grip { display: none; }
.grip {
  position: absolute; top: 12px; right: 42px;
  width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent;
  color: var(--muted); cursor: grab; display: grid; place-items: center;
  opacity: .55; touch-action: none; transition: opacity .15s, background .15s, color .15s;
}
.grip svg { width: 14px; height: 14px; }
.card:hover .grip, .grip:focus-visible { opacity: 1; }
.grip:hover { background: var(--chip, var(--bg)); color: var(--ink); }
.card.dragging { z-index: 2; outline: 2px dashed var(--accent); outline-offset: 3px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.45); }
.card.dragging .grip { opacity: 1; color: var(--accent); cursor: grabbing; }
body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
.card.is-local .card-head { padding-right: 0; }
.is-local .country::after {
  content: "本地"; flex: none;
  font-size: .66rem; font-weight: 500; letter-spacing: .12em; line-height: 1;
  padding: 4px 8px; border-radius: 999px; color: #fff; background: var(--accent); font-weight: 700;
}
.card:hover .remove, .remove:focus-visible { opacity: 1; }
.remove:hover { background: var(--chip, var(--bg)); color: var(--ink); }

/* flip clock */
.clock {
  --d: min(16.5cqi, 4.2rem);
  font-family: var(--font-digit); font-weight: 600; font-size: var(--d);
  display: flex; align-items: center; justify-content: center; gap: .07em;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.pair { display: flex; gap: .05em; }
.colon {
  width: .3em; height: 1.36em; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .3em;
}
.colon::before, .colon::after { content: ""; width: .1em; height: .1em; border-radius: 50%; background: var(--accent); }
.pair.sec { font-size: .72em; align-self: flex-end; }

.flip {
  position: relative; width: .74em; height: 1.36em;
  color: var(--tile-ink); border-radius: .08em;
  box-shadow: 0 .04em .08em rgba(0,0,0,.25);
}
.half, .leaf {
  position: absolute; left: 0; right: 0; height: 50%; overflow: hidden;
  background: var(--tile);
}
.half span, .leaf span {
  position: absolute; left: 0; right: 0; height: 1.36em;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.top, .leaf-top { top: 0; border-radius: .08em .08em 0 0; background: linear-gradient(var(--tile-hi), var(--tile)); }
.top span, .leaf-top span { top: 0; }
.bottom, .leaf-bottom { bottom: 0; border-radius: 0 0 .08em .08em; }
.bottom span, .leaf-bottom span { bottom: 0; }
.flip::after { /* hinge */
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: .025em; min-height: 1px;
  background: var(--hinge); transform: translateY(-50%); z-index: 4;
}
/* The flip folds each half flat (scaleY) instead of a 3D rotateX: iOS Safari drops the digits of
   3D-rotated, clipped layers mid-animation, while a 2D fold renders the same everywhere. */
.leaf { visibility: hidden; z-index: 3; will-change: transform; }
.leaf-top { transform-origin: 50% 100%; }
.leaf-bottom { transform-origin: 50% 0; }
.flip.go .leaf { visibility: visible; }
.flip.go .leaf-top { animation: flipTop .3s ease-in forwards; }
.flip.go .leaf-bottom { transform: scaleY(0); animation: flipBottom .3s ease-out .3s forwards; }
@keyframes flipTop { from { transform: scaleY(1); } to { transform: scaleY(0); } }
@keyframes flipBottom { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.date {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
  border-top: 1px solid var(--line); padding-top: 12px;
  font-size: .86rem; letter-spacing: .05em; font-variant-numeric: tabular-nums;
}
.date .dn { color: var(--muted); font-size: .76rem; display: inline-flex; align-items: center; gap: 6px; }
.astro { display: inline-flex; gap: 8px; margin-left: auto; color: var(--muted); }
.ev { display: inline-flex; color: var(--muted); }
.ev svg { width: 22px; height: 22px; flex: none; overflow: visible; }
.ev.dim svg { opacity: .45; }
.dn i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.dn.night i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }

.empty {
  grid-column: 1 / -1; text-align: center; color: var(--muted);
  border: 1px dashed var(--line); border-radius: 14px; padding: 48px 16px;
}
.empty button { margin-top: 12px; }

/* picker */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(10,12,15,.42);
  display: flex; align-items: flex-start; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 6vh) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  width: min(100%, 520px); max-height: min(78vh, 680px);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.45);
  display: flex; flex-direction: column; overflow: hidden;
}
.sheet-head { padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
.sheet-title { display: flex; justify-content: space-between; align-items: center; }
.sheet-title h2 { margin: 0; font-size: 1rem; letter-spacing: .1em; }
.close {
  width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  display: grid; place-items: center;
}
.close:hover { background: var(--bg); color: var(--ink); }
.close svg { width: 16px; height: 16px; }
#search {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
#search::placeholder { color: var(--muted); }
.list { overflow-y: auto; padding: 6px; }
.group-label { font-size: .72rem; letter-spacing: .14em; color: var(--muted); padding: 12px 10px 4px; }
.opt {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink);
  font: inherit; text-align: left; cursor: pointer;
}
.opt:hover:not(:disabled) { background: var(--bg); }
.opt:disabled { cursor: default; opacity: .5; }
.opt .n { min-width: 0; overflow-wrap: anywhere; }
.opt .n small { color: var(--muted); margin-left: 8px; font-size: .78rem; }
.opt .t { flex: none; font-family: var(--font-digit); font-size: 1.05rem; font-weight: 500; letter-spacing: .05em; font-variant-numeric: tabular-nums; color: var(--muted); }
.opt .t b { color: var(--ink); font-weight: 600; margin-left: 10px; }
.none { color: var(--muted); padding: 24px 10px; text-align: center; }

.btn {
  font: inherit; font-size: .86rem; letter-spacing: .06em; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 8px 16px;
}
.btn:hover { border-color: var(--accent); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: var(--ink); color: var(--bg); border-radius: 999px;
  padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 12px;
  font-size: .86rem; box-shadow: 0 12px 30px -10px rgba(0,0,0,.4);
  max-width: calc(100% - 32px);
}
.toast button { font: inherit; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; background: var(--accent); color: #fff; font-weight: 500; }

/* time planner: one slim row */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.shift {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin: 0 0 16px; padding: 5px 6px 5px 14px;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  font-size: .84rem; transition: border-color .2s ease;
}
.shift.on { border-color: var(--accent); }
.shift-label { font-weight: 500; letter-spacing: .08em; white-space: nowrap; }
/* hairline track; the part between now (centre) and the chosen time is drawn in the accent */
#shift {
  --l: 50%; --r: 50%;
  flex: 1 1 140px; min-width: 110px; height: 18px; margin: 0; cursor: pointer;
  -webkit-appearance: none; appearance: none; background: transparent;
}
#shift::-webkit-slider-runnable-track {
  height: 2px; border-radius: 2px;
  background: linear-gradient(to right, var(--line) var(--l), var(--accent) var(--l), var(--accent) var(--r), var(--line) var(--r));
}
#shift::-moz-range-track {
  height: 2px; border-radius: 2px;
  background: linear-gradient(to right, var(--line) var(--l), var(--accent) var(--l), var(--accent) var(--r), var(--line) var(--r));
}
#shift::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--muted);
}
#shift::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--muted); }
.shift.on #shift::-webkit-slider-thumb { border-color: var(--accent); background: var(--accent); }
.shift.on #shift::-moz-range-thumb { border-color: var(--accent); background: var(--accent); }
#shift:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.shift-step {
  flex: none; height: 24px; padding: 0 6px; border-radius: 999px; cursor: pointer;
  border: 0; background: transparent; color: var(--muted);
  font: inherit; font-family: var(--font-digit); font-weight: 500; font-size: .82rem; letter-spacing: .03em;
}
.shift-step:hover { color: var(--accent); }
.shift-step:focus-visible, .shift-reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shift-out { font-family: var(--font-digit); font-weight: 500; font-size: .95rem; letter-spacing: .03em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.shift.on .shift-out { color: var(--accent); }
.shift-local { white-space: nowrap; font-variant-numeric: tabular-nums; }
.shift-reset {
  flex: none; height: 24px; padding: 0 10px; border: 1px solid var(--accent); border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--accent); font: inherit; font-size: .78rem; white-space: nowrap;
}
.shift-reset:hover { background: var(--accent); color: #fff; }
@media (max-width: 640px) { .shift { border-radius: 14px; padding: 7px 10px; } }

/* phones: the tips fold behind a "how to use" button */
.howto-toggle { display: none; }
@media (max-width: 640px) {
  .howto-toggle {
    display: inline-flex; align-items: center; gap: 8px; margin: -8px 0 16px; padding: 4px 12px 4px 4px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink);
    font: inherit; font-size: .82rem; letter-spacing: .04em; cursor: pointer;
  }
  .howto-toggle .ic {
    flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
    display: grid; place-items: center; font-family: var(--font-digit); font-weight: 600; font-size: .8rem; color: var(--ink);
  }
  .howto-toggle .chev { width: 12px; height: 12px; color: var(--muted); transition: transform .2s ease; }
  .howto-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .howto-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul.howto { margin-top: -4px; }
  ul.howto:not(.open) { display: none; }
}

/* how-to line under the title */
.howto {
  list-style: none; margin: -6px 0 22px; padding: 0;
  display: flex; flex-wrap: wrap; gap: 10px 24px;
  color: var(--muted); font-size: .82rem; line-height: 1.5; letter-spacing: .03em;
}
.howto li { display: flex; align-items: flex-start; gap: 8px; min-width: 0; max-width: 100%; }
.howto .ic {
  flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: -1px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  display: grid; place-items: center;
}
.howto .ic svg { width: 12px; height: 12px; }
.howto b { color: var(--ink); font-weight: 500; margin-right: 6px; }

/* example screenshot */
.imp-note .linkish {
  font: inherit; color: var(--accent); background: none; border: 0; padding: 0; margin-left: 2px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; font-weight: 500;
}
.imp-note .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.ex-overlay { z-index: 55; }
.ex-sheet { width: min(100%, 900px); max-height: min(86vh, 900px); }
.ex-caption { margin: 0; color: var(--muted); font-size: .82rem; }
.ex-body { overflow: auto; padding: 12px; background: var(--bg); }
.ex-body img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }

/* import places */
.add-btn.import-btn:hover { transform: translateY(-1px); }
.imp-body { overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.drop {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  padding: 20px 16px; border: 1.5px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--ink);
  font: inherit; cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover:not(:disabled), .drop.over { border-color: var(--accent); }
.drop:disabled { cursor: default; opacity: .6; }
.drop svg { width: 26px; height: 26px; color: var(--accent); }
.drop b { font-size: .98rem; letter-spacing: .06em; }
.drop span { color: var(--muted); font-size: .8rem; }
.imp-note { margin: -4px 0 0; color: var(--muted); font-size: .76rem; text-align: center; }
.imp-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.imp-thumbs:empty { display: none; }
.imp-thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.imp-status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.imp-status .spin { display: none; width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
.imp-status.busy .spin { display: block; }
.imp-status.err { color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.imp-sum { font-size: .86rem; color: var(--ink); font-weight: 500; letter-spacing: .03em; }
.imp-list { display: flex; flex-direction: column; gap: 2px; }
.imp-list:empty { display: none; }
.imp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 10px; }
.imp-row:nth-child(odd) { background: var(--bg); }
.imp-row .n { min-width: 0; overflow-wrap: anywhere; }
.imp-row .n small { display: block; color: var(--muted); font-size: .78rem; }
.tag { flex: none; font-size: .74rem; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.tag.new { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.tag.have, .tag.merged { color: var(--ink); }
.imp-text { display: flex; flex-direction: column; gap: 6px; }
.imp-text label { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
#impText {
  width: 100%; min-height: 96px; resize: vertical; font: inherit; font-size: 15px; line-height: 1.5; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
#impText::placeholder { color: var(--muted); }
#impText:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.imp-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }

@media (prefers-reduced-motion: reduce) {
  .imp-status .spin { animation: none; }
  .flip.go .leaf { visibility: hidden; animation: none; }
  .add-btn, .add-btn:hover { transition: none; transform: none; }
}
</style>

    const cover = `<rect x="-2" y="${H}" width="20" height="8" fill="var(--surface)"/>`;
    const line = `<path d="M1.5 ${H}h13" stroke="currentColor" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/>`;
    const water = rising ? "" : `<path d="M5 ${H + 2.2}h6M6.6 ${H + 4}h2.8" stroke="currentColor" stroke-opacity=".35" stroke-width="1.1" stroke-linecap="round"/>`;
    return svg(body + cover + line + water);
  }
  function horizonSun(rising) {
    const r = 3.7, cy = rising ? H - 1.9 : H + 0.4;
    const rays = rising ? `<path d="${[-90, -140, -40].map(a => ray(8, cy, a, r + 1.7, r + 3.1)).join("")}" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round"/>` : "";
    return horizon(`<circle cx="8" cy="${cy}" r="${r}" fill="var(--accent)"/>${rays}`, rising);

  // Lit part of the moon from its illuminated fraction; mirrored south of the equator.
  function moonShape(cx, cy, r, ill, south) {
    const f = ill.fraction, waxing = ill.phase < 0.5;
    let lit = "";
    if (f > 0.985) lit = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--moon, #d9d6cc)"/>`;
    else if (f > 0.015) {
      const rx = (r * Math.abs(1 - 2 * f)).toFixed(2);
      const s1 = waxing ? 1 : 0, s2 = f < 0.5 ? (waxing ? 0 : 1) : (waxing ? 1 : 0);
      lit = `<path d="M${cx} ${cy - r}A${r} ${r} 0 0 ${s1} ${cx} ${cy + r}A${rx} ${r} 0 0 ${s2} ${cx} ${cy - r}Z" fill="var(--moon, #d9d6cc)"/>`;
    }
    const flip = south ? ` transform="matrix(-1 0 0 1 ${2 * cx} 0)"` : "";
    return `<g${flip}><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1"/>${lit}</g>`;
  }
  const moonIcon = a => svg(moonShape(8, 8, 6, a.ill, a.south));
  const horizonMoon = (a, rising) => horizon(moonShape(8, rising ? H - 1.9 : H + 0.4, 4, a.ill, a.south), rising);

  // Within an hour of a rise or set (moon events only at night) the card shows the twilight sky.
  function paintSky(r, a) {
    const tw = !!a && (a.sun.rise || a.sun.set || (!a.sun.up && (a.moon.rise || a.moon.set)));
    r.card.classList.toggle("is-twilight", !!tw);
  }

  function paintAstro(r, now) {
    const a = r.ast, tz = r.c.tz;
    paintSky(r, a);
    r.astro.hidden = !a;
    r.dn.hidden = !!a;
    if (!a) return;
    const icons = [];
    const J = L("join"), phase = phaseName(a.ill) + J + L("lit", Math.round(a.ill.fraction * 100));
    if (a.sun.rise) icons.push(["rise", horizonSun(true), L("at", L("rise"), hm(tz, a.sun.rise))]);
    else if (a.sun.set) icons.push(["set", horizonSun(false), L("at", L("set"), hm(tz, a.sun.set))]);
    else if (a.sun.up) icons.push(["sun", sunIcon(), L("sunUp")]);
    // One icon only: the sun (or sunrise/sunset) takes the slot; the moon shows only at night.
    else if (a.moon.rise) icons.push(["moon", horizonMoon(a, true), L("at", L("mrise"), hm(tz, a.moon.rise)) + J + phase]);
    else if (a.moon.set) icons.push(["moon", horizonMoon(a, false), L("at", L("mset"), hm(tz, a.moon.set)) + J + phase]);
    else if (a.moon.up) icons.push(["moon", moonIcon(a), L("moonUp") + J + phase]);
    else icons.push(["moon dim", moonIcon(a), L("moonDown") + J + phase]);
    const html = icons.map(([cls, s, label]) => `<span class="ev ${cls}" role="img" title="${label}" aria-label="${label}">${s}</span>`).join("");
    if (r.astro._h !== html) { r.astro.innerHTML = html; r.astro._h = html; }
  }

  // ---- flip digit ----
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  function makeFlip() {
    const el = document.createElement("span");
    el.className = "flip";
    el.innerHTML = '<span class="half top"><span></span></span><span class="half bottom"><span></span></span><span class="leaf leaf-top"><span></span></span><span class="leaf leaf-bottom"><span></span></span>';
    const [top, bottom, lt, lb] = el.querySelectorAll(".half > span, .leaf > span");
    el._v = null;
    el._set = (v, animate) => {
      if (v === el._v) return;
      const old = el._v;
      el._v = v;
      if (!animate || old === null || reduce.matches || document.hidden) {
        el.classList.remove("go");
        top.textContent = bottom.textContent = v;
        return;
      }
      top.textContent = v; bottom.textContent = old;
      lt.textContent = old; lb.textContent = v;
      el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
      clearTimeout(el._t);
      el._t = setTimeout(() => { bottom.textContent = el._v; el.classList.remove("go"); }, 620);
    };
    return el;
  }

  // ---- cards ----
  const grid = document.getElementById("grid");
  const cards = new Map();

  function buildCard(c) {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <div class="place"><div class="country"><span class="name"></span></div><div class="city"></div></div>
        <div class="meta"><div class="offset"></div><div class="rel"></div></div>
      </div>
      <button class="grip" type="button"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/></svg></button>
      <button class="remove" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
      <div class="clock" role="timer" aria-live="off"></div>
      <div class="date"><span class="ymd"></span><span class="dn"><i></i><span></span></span><span class="astro" hidden></span></div>`;
    card.querySelector(".country .name").textContent = countryName(c);
    card.querySelector(".city").textContent = cityName(c) === countryName(c) ? c.tz.replace(/_/g, " ") : cityName(c);
    card.querySelector(".place").title = countryName(c) + L("sep") + card.querySelector(".city").textContent;
    const rm = card.querySelector(".remove");
    rm.setAttribute("aria-label", L("removeAria", fullName(c)));
    rm.title = L("remove");
    rm.addEventListener("click", () => removeCity(c.id));
    card.dataset.id = c.id;
    const grip = card.querySelector(".grip");
    grip.setAttribute("aria-label", L("dragAria", countryName(c)));
    grip.title = L("drag");
    grip.addEventListener("pointerdown", e => startDrag(e, card, grip));
    grip.addEventListener("keydown", e => keyMove(e, card, grip));

    const clock = card.querySelector(".clock");
    const flips = [];
    ["h", "m", "s"].forEach((k, idx) => {
      if (idx) { const col = document.createElement("span"); col.className = "colon"; col.setAttribute("aria-hidden", "true"); clock.appendChild(col); }
      const pair = document.createElement("span");
      pair.className = "pair" + (k === "s" ? " sec" : "");
      pair.setAttribute("aria-hidden", "true");
      const a = makeFlip(), b = makeFlip();
      pair.append(a, b); clock.appendChild(pair); flips.push(a, b);
    });
    return {
      card, flips, clock,
      offset: card.querySelector(".offset"),
      rel: card.querySelector(".rel"),
      ymd: card.querySelector(".ymd"),
      dn: card.querySelector(".dn"),
      dnText: card.querySelector(".dn > span"),
      astro: card.querySelector(".astro"),
      astroMin: -1, ast: null,
      c,
    };
  }

  function render() {
    // Local time always first; the rest keep the user's order (skipping any entry in the same time zone).
    const order = [localId, ...selected.filter(id => { const c = resolve(id); return c && id !== localId; })];
    const keep = new Set(order);
    for (const [id, r] of cards) if (!keep.has(id)) { r.card.remove(); cards.delete(id); }
    grid.querySelector(".empty")?.remove();
    order.forEach(id => {
      let r = cards.get(id);
      if (!r) { const c = resolve(id); if (!c) return; r = buildCard(c); cards.set(id, r); }
      r.card.classList.toggle("is-local", id === localId);
      grid.appendChild(r.card);
    });
    if (order.length <= 1) {
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = '<div></div><button class="btn" type="button"></button>';
      e.firstChild.textContent = L("empty");
      e.querySelector("button").textContent = L("add");
      e.querySelector("button").addEventListener("click", openPicker);
      grid.appendChild(e);
    }
    tick(false);
  }

  const localInfo = document.getElementById("localInfo");
  const localTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; } })();
  const localAlias = Object.keys(TZ_FALLBACK).find(k => TZ_FALLBACK[k] === localTz);
  const localCity = CITIES.find(c => c.tz === localTz || c.tz === localAlias) || resolve("tz:" + localTz) || resolve("tz:UTC");
  const localId = localCity.id;
  if (!byId.has(localId)) byId.set(localId, localCity);

  // ---- phones: show or hide the tips ----
  const howtoToggle = document.getElementById("howtoToggle");
  howtoToggle.addEventListener("click", () => {
    const open = howtoToggle.getAttribute("aria-expanded") !== "true";
    howtoToggle.setAttribute("aria-expanded", String(open));
    document.getElementById("howto").classList.toggle("open", open);
  });

  // ---- time planner: every clock shows local time moved by up to ±24 h ----
  let shiftMin = 0;
  const shiftEl = document.getElementById("shift"), shiftBar = document.getElementById("shiftBar");
  const shiftOut = document.getElementById("shiftOut"), shiftLocal = document.getElementById("shiftLocal");
  const shiftReset = document.getElementById("shiftReset");
  function paintShift() {
    const on = shiftMin !== 0, a = Math.abs(shiftMin);
    shiftBar.classList.toggle("on", on);
    shiftReset.hidden = !on;
    shiftLocal.hidden = !on;
    shiftOut.textContent = on ? L(shiftMin > 0 ? "later" : "earlier", L("hm", Math.floor(a / 60), a % 60)) : L("nowLabel");
    shiftEl.setAttribute("aria-valuetext", shiftOut.textContent);
  }

    shiftMin = Math.max(-1440, Math.min(1440, Math.round(m / 15) * 15));
    shiftEl.value = shiftMin;
    const pos = (shiftMin + 1440) / 2880 * 100;
    shiftEl.style.setProperty("--l", Math.min(50, pos) + "%");
    shiftEl.style.setProperty("--r", Math.max(50, pos) + "%");
    paintShift();
    tick(false);
  }

  document.getElementById("shiftBack").addEventListener("click", () => setShift(shiftMin - 60));
  document.getElementById("shiftFwd").addEventListener("click", () => setShift(shiftMin + 60));
  shiftReset.addEventListener("click", () => { setShift(0); shiftEl.focus(); });

  function tick(animate = true) {
    const now = new Date(Date.now() + shiftMin * 6e4);
    const li = info(localTz, now);
    shiftLocal.textContent = `${L("localAt")} ${li.mo}/${li.d} ${li.wd} ${pad(li.h)}:${pad(li.mi)}`;
    localInfo.textContent = `${L("local")} ${localTz.replace(/_/g, " ")} · ${gmt(li.offset)}`;
    for (const r of cards.values()) {
      const i = info(r.c.tz, now);
      const digits = pad(i.h) + pad(i.mi) + pad(i.s);
      r.flips.forEach((f, k) => f._set(digits[k], animate));
      r.clock.setAttribute("aria-label", `${countryName(r.c)} ${pad(i.h)}:${pad(i.mi)}:${pad(i.s)}`);
      r.offset.textContent = gmt(i.offset);
      r.rel.textContent = relText(i.offset, li.offset, i, li);
      r.ymd.textContent = L("date", i, i.wd);
      const minute = Math.floor(now.getTime() / 6e4);
      if (r.astroMin !== minute) { r.astroMin = minute; r.ast = astro(r.c, now); paintAstro(r, now); }
      const day = r.ast ? r.ast.sun.up : (i.h >= 6 && i.h < 18);

      r.card.classList.toggle("is-day", day);
      r.card.classList.toggle("is-night", !day);

  }
  function loop() { tick(true); setTimeout(loop, 1000 - (Date.now() % 1000) + 8); }

  // ---- drag to reorder ----
  function flip(mutate) {
    const els = [...grid.querySelectorAll(".card")];
    const first = new Map(els.map(el => [el, el.getBoundingClientRect()]));
    mutate();
    if (reduce.matches) return;
    els.forEach(el => {
      const f = first.get(el), l = el.getBoundingClientRect();
      const dx = f.left - l.left, dy = f.top - l.top;

  function commitOrder() {
    const dom = [...grid.querySelectorAll(".card")].map(el => el.dataset.id).filter(id => id !== localId);

    selected = selected.map(id => { const c = resolve(id); return id === localId ? id : dom[k++]; }).filter(Boolean);
    while (k < dom.length) selected.push(dom[k++]);

  function startDrag(e, card, grip) {

      window.removeEventListener("pointercancel", end);

  }

  function countryGroups(cc) {
    const ks = new Map();
    (zonesByCc.get(cc) || []).forEach(tz => { const k = groupKey(cc, tz); if (!ks.has(k)) ks.set(k, tz); });
    return ks;
  }

  // Turn found names into clocks: one per country and time zone group, in order of first mention.
  function planImport(text) {
    const hits = findPlaces(text);
    const existing = new Map();
    [localId, ...selected].forEach(id => {
      const c = resolve(id);
      if (c && c.cc) { const k = groupKey(c.cc, c.tz); if (!existing.has(k)) existing.set(k, c); }
    });
    const placeCcs = new Set(hits.filter(h => h.c.kind !== "country").map(h => h.c.cc));
    const groups = new Map(), rows = [], seen = new Set();
    hits.forEach(h => {
      const c = h.c, label = norm(h.text);
      let k, tz = c.tz;
      if (c.kind === "country") {
        const gs = countryGroups(c.cc);
        if (gs.size !== 1) {
          if (!seen.has(label)) { seen.add(label); rows.push({ text: h.text, cc: c.cc, st: placeCcs.has(c.cc) ? "multiPlaces" : "multi" }); }
          return;
        }
        const only = [...gs][0];
        k = only[0]; tz = only[1];
      } else k = groupKey(c.cc, c.tz);
      let g = groups.get(k);
      if (!g) { g = { k, cc: c.cc, tz, cities: [], first: h }; groups.set(k, g); }
      if (c.kind === "city" && !g.cities.includes(c.city)) g.cities.push(c.city);
      if (!seen.has(label)) { seen.add(label); rows.push({ text: h.text, g, first: g.first === h }); }
    });
    for (const g of groups.values()) {
      const s = g.k.slice(g.k.indexOf("|") + 1);
      const primary = CITIES.find(x => x.cc === g.cc && sig(x.tz) === s);
      g.rep = (primary && g.cities.includes(primary)) ? primary : (g.cities[0] || primary || zoneEntry(g.tz));
      g.have = existing.get(g.k) || null;
    }
    return { rows, groups: [...groups.values()].filter(g => g.rep) };
  }

  // ---- import sheet ----
  const importBtn = document.getElementById("importBtn"), importFile = document.getElementById("importFile");
  const impOverlay = document.getElementById("impOverlay"), impDrop = document.getElementById("impDrop");
  const impThumbs = document.getElementById("impThumbs"), impStatus = document.getElementById("impStatus"), impStatusText = document.getElementById("impStatusText");
  const impSum = document.getElementById("impSum"), impList = document.getElementById("impList");
  const impText = document.getElementById("impText"), impTextLabel = document.getElementById("impTextLabel");
  const impStop = document.getElementById("impStop"), impFromText = document.getElementById("impFromText"), impDone = document.getElementById("impDone");
  let thumbUrls = [], ocrRun = 0;

  function openImport() {
    impOverlay.hidden = false;
    impDrop.focus();
  }
  function closeImport() {
    stopOcr();
    impOverlay.hidden = true;
    importBtn.focus();
  }
  importBtn.addEventListener("click", openImport);
  impDrop.addEventListener("click", () => { importFile.value = ""; importFile.click(); });
  importFile.addEventListener("change", () => { const f = [...importFile.files]; if (f.length) runOcr(f); });
  impStop.addEventListener("click", stopOcr);
  const exOverlay = document.getElementById("exOverlay"), exBtn = document.getElementById("impExampleBtn");
  const closeEx = () => { exOverlay.hidden = true; exBtn.focus(); };
  exBtn.addEventListener("click", () => { exOverlay.hidden = false; document.getElementById("exClose").focus(); });
  document.getElementById("exClose").addEventListener("click", closeEx);
  exOverlay.addEventListener("click", e => { if (e.target === exOverlay) closeEx(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !exOverlay.hidden) { e.stopImmediatePropagation(); closeEx(); } }, true);
  impDone.addEventListener("click", closeImport);
  document.getElementById("impClose").addEventListener("click", closeImport);
  impOverlay.addEventListener("click", e => { if (e.target === impOverlay) closeImport(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !impOverlay.hidden) closeImport(); });
  impFromText.addEventListener("click", () => {
    if (!impText.value.trim()) { setStatus(L("impNeedText"), true); impText.focus(); return; }
    setStatus("");
    applyImport(impText.value);
  });
  ["dragenter", "dragover"].forEach(t => impDrop.addEventListener(t, e => { e.preventDefault(); impDrop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => impDrop.addEventListener(t, () => impDrop.classList.remove("over")));
  impDrop.addEventListener("drop", e => {
    e.preventDefault();
    const f = [...(e.dataTransfer?.files || [])].filter(x => x.type.startsWith("image/"));
    if (f.length) runOcr(f);
  });
  document.addEventListener("paste", e => {
    if (impOverlay.hidden) return;
    const f = [...(e.clipboardData?.files || [])].filter(x => x.type.startsWith("image/"));
    if (f.length) { e.preventDefault(); runOcr(f); }
  });

  function setStatus(text, isErr, busy) {
    impStatus.hidden = !text;
    impStatus.classList.toggle("err", !!isErr);
    impStatus.classList.toggle("busy", !!busy);
    impStatusText.textContent = text || "";
  }
  function setBusy(on) {
    impStop.hidden = !on;
    impFromText.disabled = on; impDrop.disabled = on; impText.disabled = on;
  }

  // ---- text recognition (Tesseract.js, loaded on first use; language data ships with this page) ----
  const TESS = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/";
  const TESS_CORE = "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1";
  let tessLoad = null, ocrWorker = null, onOcrLog = () => {};
  function loadTess() {
    if (window.Tesseract) return Promise.resolve();
    if (!tessLoad) tessLoad = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = TESS + "tesseract.min.js";
      s.onload = res;
      s.onerror = () => { tessLoad = null; rej(new Error("script")); };
      document.head.appendChild(s);
    });
    return tessLoad;
  }
  async function getWorker() {
    await loadTess();
    if (!ocrWorker) {
      // The language files are published as tessdata/<lang>.traineddata.wasm (gzip bytes; artifacts
      // serve no .gz), so the worker's fetch is pointed at that name before Tesseract loads.
      const boot = new Blob([
        "const f = self.fetch.bind(self);\n" +
        "self.fetch = (u, o) => f(String(u).replace(/\\.traineddata\\.gz$/, '.traineddata.wasm'), o);\n" +
        "importScripts(" + JSON.stringify(TESS + "worker.min.js") + ");\n",
      ], { type: "text/javascript" });
      ocrWorker = Tesseract.createWorker(["chi_tra", "eng"], 1, {
        workerPath: URL.createObjectURL(boot),
        workerBlobURL: false,
        corePath: TESS_CORE,
        langPath: new URL("tessdata", document.baseURI).href,
        cacheMethod: "none",
        logger: m => onOcrLog(m),
        errorHandler: () => {},
      }).catch(e => { ocrWorker = null; throw e; });
    }
    return ocrWorker;
  }
  function stopOcr() {
    if (!ocrRun) return;
    ocrRun = 0;
    const w = ocrWorker;
    ocrWorker = null;
    if (w) w.then(x => x.terminate()).catch(() => {});
    setBusy(false);
    setStatus("");
  }
  async function loadImage(file) {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
    return new Promise((res, rej) => {
      const u = URL.createObjectURL(file), im = new Image();
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("image")); };
      im.src = u;
    });
  }
  // Small screenshots read far better enlarged and in grey.
  async function prepImage(file) {
    const img = await loadImage(file);
    const w = img.width, h = img.height;
    let scale = w < 1200 ? 2 : w < 1800 ? 1.5 : 1;
    if (w * h * scale * scale > 12e6) scale = Math.max(1, Math.sqrt(12e6 / (w * h)));
    const cv = document.createElement("canvas");
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const px = ctx.getImageData(0, 0, cv.width, cv.height), d = px.data;
    for (let i = 0; i < d.length; i += 4) { const y = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000; d[i] = d[i + 1] = d[i + 2] = y; }
    ctx.putImageData(px, 0, 0);
    return cv;
  }

  async function runOcr(files) {
    if (ocrRun) return;
    const run = ocrRun = Date.now();
    thumbUrls.forEach(u => URL.revokeObjectURL(u)); thumbUrls = [];
    impThumbs.textContent = "";
    files.forEach(f => { const u = URL.createObjectURL(f); thumbUrls.push(u); const im = document.createElement("img"); im.src = u; im.alt = f.name; impThumbs.appendChild(im); });
    impSum.hidden = true; impList.textContent = "";
    setBusy(true);
    let idx = 0;
    onOcrLog = m => {
      if (ocrRun !== run) return;
      const pct = Math.round((m.progress || 0) * 100);
      if (m.status === "recognizing text") setStatus(L("ocrReading", idx + 1, files.length, pct), false, true);
      else if (/language/.test(m.status)) setStatus(L("ocrLang"), false, true);
      else setStatus(L("ocrEngine"), false, true);
    };
    setStatus(L("ocrEngine"), false, true);
    const texts = [];
    try {
      const worker = await getWorker();
      for (idx = 0; idx < files.length; idx++) {
        if (ocrRun !== run) return;
        let canvas;
        try { canvas = await prepImage(files[idx]); } catch (e) { texts.push(""); continue; }
        setStatus(L("ocrReading", idx + 1, files.length, 0), false, true);
        const { data } = await worker.recognize(canvas);
        texts.push((data && data.text || "").trim());
      }
    } catch (e) {
      if (ocrRun !== run) return;
      ocrRun = 0; ocrWorker = null;
      setBusy(false);
      setStatus(texts.length ? L("ocrFailedPart") : L("ocrFailed"), true);
      if (!texts.length) return;
    }
    if (ocrRun !== run && ocrRun !== 0) return;
    ocrRun = 0;
    setBusy(false);
    const text = texts.filter(Boolean).join("\n\n");
    impText.value = text;
    impTextLabel.textContent = L("ocrText");
    if (!text) { setStatus(L("ocrNoText"), true); return; }
    if (!impStatus.classList.contains("err")) setStatus("");
    applyImport(text);
  }

  function applyImport(text) {
    const { rows, groups } = planImport(text);
    const prev = selected.slice();
    let added = 0;
    groups.forEach(g => {
      if (g.have || selected.includes(g.rep.id) || g.rep.id === localId) return;
      selected.push(g.rep.id); g.added = true; added++;
    });
    if (added) {
      save(); render();
      undo = { prev };
      toastMsg.textContent = L("imported", added);
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; undo = null; }, 8000);
    }
    const now = new Date();
    impSum.hidden = false;
    impSum.textContent = rows.length ? L("impSum", added, rows.length) : L("impNone");
    impList.textContent = "";
    rows.forEach(r => {
      const row = document.createElement("div");
      row.className = "imp-row";
      row.innerHTML = '<span class="n"></span><span class="tag"></span>';
      const n = row.querySelector(".n"), tag = row.querySelector(".tag");
      n.textContent = r.text;
      const sm = document.createElement("small");
      let st;
      if (r.g) {
        const c = r.g.have || r.g.rep;
        st = r.g.have ? "have" : (r.first && r.g.added ? "new" : "merged");
        sm.textContent = (st === "merged" ? L("into") : "") + fullName(c) + L("sep") + gmt(info(c.tz, now).offset);
      } else {
        st = r.st;
        sm.textContent = (lang === "en" ? (COUNTRY_EN[r.cc] || countryEn(r.cc)) : countryZh(r.cc)) + L("sep") + L(r.st === "multi" ? "multiNote" : "multiPlacesNote");
      }
      n.appendChild(sm);
      tag.classList.add(st);
      tag.textContent = L("st_" + st);
      impList.appendChild(row);
    });
  }

  // ---- picker ----
  const overlay = document.getElementById("overlay"), search = document.getElementById("search"), list = document.getElementById("list");
  const addBtn = document.getElementById("addBtn");
  function openPicker() {
    overlay.hidden = false; search.value = ""; renderList();
    setTimeout(() => search.focus(), 20);
  }
  function closePicker() { overlay.hidden = true; addBtn.focus(); }
  addBtn.addEventListener("click", openPicker);
  document.getElementById("closeBtn").addEventListener("click", closePicker);
  overlay.addEventListener("click", e => { if (e.target === overlay) closePicker(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) closePicker(); });
  search.addEventListener("input", renderList);

  function optButton(c, now) {
    const i = info(c.tz, now);
    const added = selected.includes(c.id) || c.id === localId;
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.disabled = added;
    b.dataset.tz = c.tz;
    b.innerHTML = '<span class="n"></span><span class="t"></span>';
    const n = b.querySelector(".n");
    n.textContent = countryName(c);
    const sm = document.createElement("small");
    sm.textContent = added ? cityName(c) + L("sep") + L("added") : cityName(c);
    n.appendChild(sm);
    const t = b.querySelector(".t");
    t.textContent = gmt(i.offset);
    const bt = document.createElement("b"); bt.textContent = pad(i.h) + ":" + pad(i.mi); t.appendChild(bt);
    b.addEventListener("click", () => {
      selected.push(c.id); save(); render(); closePicker();
      const r = cards.get(c.id); r && r.card.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "center" });
    });
    return b;
  }

  function renderList() {
    const raw = search.value.trim();
    const q = norm(raw);
    const now = new Date();
    list.textContent = "";
    const frag = document.createDocumentFragment();
    const label = t => { const g = document.createElement("div"); g.className = "group-label"; g.textContent = t; frag.appendChild(g); };
    if (!q) {
      REGIONS.forEach(r => {
        const cs = CITIES.filter(c => region(c) === r);
        if (cs.length) { label(L("regions")[r]); cs.forEach(c => frag.appendChild(optButton(c, now))); }
      });
      list.appendChild(frag);
      return;
    }
    const score = c => c.cityKey.startsWith(q) ? 0 : c.cityKey.includes(q) ? 1 : c.countryKey.startsWith(q) ? 2 : c.key.includes(q) ? 3 : -1;
    const hits = CITIES.map(c => [score(c), c]).filter(x => x[0] >= 0).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    if (hits.length) { label(L("cities")); hits.forEach(c => frag.appendChild(optButton(c, now))); }

    // Every other tzdata zone that matches (so each region of a country is reachable), then any remaining zone name.
    const shown = new Set(hits.map(c => c.tz));
    const zones = [];
    const consider = tz => {
      if (shown.has(tz)) return;
      const c = zoneEntry(tz);
      if (!c || shown.has(c.tz) || !c.key.includes(q)) return;
      shown.add(c.tz); zones.push(c);
    };
    for (const tz of ZONES.keys()) consider(tz);
    allZones.forEach(tz => { if (!ZONES.has(tz)) consider(tz); });
    if (zones.length) { label(L("otherZones")); zones.slice(0, 80).forEach(c => frag.appendChild(optButton(c, now))); }

    if (!hits.length && !zones.length) {
      const n = document.createElement("div"); n.className = "none";
      n.textContent = L("none", raw);
      frag.appendChild(n);
    }
    list.appendChild(frag);
  }

  // ---- language toggle ----
  const langBtn = document.getElementById("langBtn");
  function applyLang() {
    document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
    document.title = L("title");
    document.getElementById("appTitle").textContent = L("title");
    document.querySelectorAll("#howto [data-k]").forEach(el => { el.textContent = L(el.dataset.k); });
    document.getElementById("howtoToggleText").textContent = L("howtoBtn");
    document.getElementById("shiftLabel").textContent = L("shiftTitle");
    document.getElementById("shiftBack").setAttribute("aria-label", L("back1"));
    document.getElementById("shiftFwd").setAttribute("aria-label", L("fwd1"));
    shiftReset.textContent = L("backToNow");
    paintShift();
    langBtn.querySelectorAll("span").forEach(x => x.classList.toggle("on", x.dataset.l === lang));
    langBtn.setAttribute("aria-label", L("langAria")); langBtn.title = L("langAria");
    addBtn.setAttribute("aria-label", L("add")); addBtn.title = L("add");
    document.getElementById("pickerTitle").textContent = L("add");
    document.getElementById("closeBtn").setAttribute("aria-label", L("close"));
    search.placeholder = L("search");
    document.getElementById("undoBtn").textContent = L("undo");
    importBtn.setAttribute("aria-label", L("importBtn")); importBtn.title = L("importBtn");
    document.getElementById("impTitle").textContent = L("importBtn");
    document.getElementById("impClose").setAttribute("aria-label", L("close"));
    document.getElementById("impDropTitle").textContent = L("dropTitle");
    document.getElementById("impDropHint").textContent = L("dropHint");
    document.getElementById("impPrivacy").textContent = L("privacy");
    document.getElementById("impExampleBtn").textContent = L("exLink");
    document.getElementById("exTitle").textContent = L("exTitle");
    document.getElementById("exCaption").textContent = L("exCaption");
    document.getElementById("exImg").alt = L("exAlt");
    document.getElementById("exClose").setAttribute("aria-label", L("close"));
    impTextLabel.textContent = impText.value ? L("ocrText") : L("pasteLabel");
    impText.placeholder = L("pastePh");
    impStop.textContent = L("stop"); impFromText.textContent = L("fromText"); impDone.textContent = L("done");
    // rebuild cards so every name and label switches
    for (const r of cards.values()) r.card.remove();
    cards.clear();
    render();
    if (!overlay.hidden) renderList();
  }
  langBtn.addEventListener("click", () => {
    lang = lang === "en" ? "zh" : "en";
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    toast.hidden = true;
    applyLang();
  });

  applyLang();
  syncCloud();
  setTimeout(loop, 1000 - (Date.now() % 1000) + 8);
})();
</script>
</body>
</html>
